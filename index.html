<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🚦 California DMV Practice Test Simulator</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --accent:#38bdf8; --accent2:#fbbf24;
    --good:#22c55e; --bad:#ef4444; --text:#e2e8f0; --muted:#94a3b8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e3a5f); color:var(--text);
    min-height:100vh; display:flex; justify-content:center; padding:20px;
  }
  .app{ width:100%; max-width:640px; }
  h1{ text-align:center; font-size:1.5rem; margin-bottom:4px;}
  .sub{ text-align:center; color:var(--muted); margin-bottom:24px; font-size:0.9rem;}
  .card{
    background:var(--card); border-radius:16px; padding:24px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4); margin-bottom:16px;
  }
  .choice-grid{ display:flex; flex-direction:column; gap:14px; margin-top:8px;}
  .mode-btn{
    display:flex; align-items:center; gap:14px; padding:20px; border-radius:14px;
    border:2px solid #334155; background:#0f1b2e; color:var(--text);
    font-size:1.1rem; cursor:pointer; transition:all .15s; text-align:left;
  }
  .mode-btn:hover{ border-color:var(--accent); transform:translateY(-2px); }
  .mode-btn .emoji{ font-size:1.8rem; }
  .section-title{ font-weight:700; margin:18px 0 8px; color:var(--accent2); font-size:0.95rem;}
  .set-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-top:6px;}
  .set-btn{
    padding:14px 6px; border-radius:10px; border:2px solid #334155; background:#0f1b2e;
    color:var(--text); cursor:pointer; font-weight:700; text-align:center; font-size:0.95rem;
  }
  .set-btn:hover{ border-color:var(--accent); }
  .set-btn small{ display:block; font-weight:400; color:var(--muted); font-size:0.7rem; margin-top:2px;}
  .progress-wrap{ background:#0f1b2e; border-radius:8px; height:10px; overflow:hidden; margin-bottom:18px;}
  .progress-bar{ height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .25s; }
  .qnum{ color:var(--muted); font-size:0.85rem; margin-bottom:6px; }
  .question{ font-size:1.15rem; font-weight:600; margin-bottom:18px; line-height:1.4;}
  .option{
    display:block; width:100%; text-align:left; padding:14px 16px; margin-bottom:10px;
    border-radius:10px; border:2px solid #334155; background:#0f1b2e; color:var(--text);
    font-size:1rem; cursor:pointer; transition:all .12s;
  }
  .option:hover{ border-color:var(--accent); }
  .option.selected{ border-color:var(--accent); background:#13283f; }
  .option.correct{ border-color:var(--good); background:#0f2e1f; }
  .option.incorrect{ border-color:var(--bad); background:#2e1313; }
  .nav-row{ display:flex; justify-content:space-between; margin-top:20px; gap:10px; }
  button.primary{
    background:linear-gradient(135deg,var(--accent),#0ea5e9); color:#04212f; border:none;
    padding:13px 22px; border-radius:10px; font-weight:700; font-size:1rem; cursor:pointer;
  }
  button.primary:disabled{ opacity:0.4; cursor:not-allowed; }
  button.secondary{
    background:transparent; color:var(--muted); border:2px solid #334155;
    padding:13px 22px; border-radius:10px; font-weight:600; cursor:pointer;
  }
  .result-icon{ text-align:center; font-size:4rem; margin-bottom:6px;}
  .result-title{ text-align:center; font-size:1.6rem; font-weight:800; margin-bottom:4px;}
  .result-sub{ text-align:center; color:var(--muted); margin-bottom:20px;}
  .pass{ color:var(--good); }
  .fail{ color:var(--bad); }
  .score-box{ text-align:center; font-size:2.4rem; font-weight:900; margin:10px 0 24px; }
  .review{ border-top:1px solid #334155; padding-top:14px; margin-top:6px; font-size:0.9rem; }
  .review-item{ padding:10px 0; border-bottom:1px solid #1f2c40; }
  .review-item .qtext{ font-weight:600; margin-bottom:4px; }
  .tag-correct{ color:var(--good); }
  .tag-wrong{ color:var(--bad); }
  .hidden{ display:none; }
  .badge{
    display:inline-block; padding:3px 10px; border-radius:20px; font-size:0.75rem;
    background:#13283f; color:var(--accent); margin-bottom:14px;
  }
  .back-link{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:0.85rem; margin-bottom:10px; padding:0;}
  .back-link:hover{ color:var(--accent); }
</style>
</head>
<body>
<div class="app">
  <h1>🚦 California DMV Practice Test Simulator</h1>
  <div class="sub">Practice questions based on the California DMV Driver Handbook. Not an official DMV product; always confirm current rules at dmv.ca.gov. 📘</div>

  <!-- STEP 1: TYPE SELECT -->
  <div id="screen-type" class="card">
    <div class="choice-grid">
      <button class="mode-btn" onclick="chooseType('car')">
        <span class="emoji">🚗</span>
        <div>
          <div style="font-weight:700;">Car / Standard License Test</div>
          <div style="color:var(--muted); font-size:0.85rem;">100-question bank · pass at 80%</div>
        </div>
      </button>
      <button class="mode-btn" onclick="chooseType('moto')">
        <span class="emoji">🏍️</span>
        <div>
          <div style="font-weight:700;">Motorcycle License Test</div>
          <div style="color:var(--muted); font-size:0.85rem;">100-question bank · pass at 80%</div>
        </div>
      </button>
    </div>
  </div>

  <!-- STEP 2: RANDOM vs SEQUENTIAL -->
  <div id="screen-format" class="card hidden">
    <button class="back-link" onclick="show('screen-type')">⬅️ Back</button>
    <div class="badge" id="formatBadge"></div>
    <div class="choice-grid">
      <button class="mode-btn" onclick="startRandom()">
        <span class="emoji">🎲</span>
        <div>
          <div style="font-weight:700;">Random Practice Test</div>
          <div style="color:var(--muted); font-size:0.85rem;">20 random questions from the full bank, shuffled every time</div>
        </div>
      </button>
      <button class="mode-btn" onclick="showSets()">
        <span class="emoji">📑</span>
        <div>
          <div style="font-weight:700;">Sequential Test Sets</div>
          <div style="color:var(--muted); font-size:0.85rem;">Fixed sets of 20, always in the same order , good for tracking progress</div>
        </div>
      </button>
    </div>
    <div id="setPicker" class="hidden">
      <div class="section-title">📑 Choose a set</div>
      <div class="set-grid" id="setGrid"></div>
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="screen-quiz" class="card hidden">
    <div class="badge" id="modeBadge"></div>
    <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    <div class="qnum" id="qnum"></div>
    <div class="question" id="qtext"></div>
    <div id="options"></div>
    <div class="nav-row" id="nav-normal">
      <button class="secondary" id="quitBtn" onclick="showQuitConfirm()">⬅️ Quit</button>
      <button class="primary" id="nextBtn" disabled onclick="nextQuestion()">Next ➡️</button>
    </div>
    <div class="nav-row hidden" id="nav-confirm" style="background:#1a1a2e;border-radius:10px;padding:14px;flex-direction:column;gap:10px;align-items:center;">
      <div style="font-size:0.95rem;color:var(--text);">⚠️ Quit and lose your progress?</div>
      <div style="display:flex;gap:10px;">
        <button class="secondary" onclick="hideQuitConfirm()">Keep Going</button>
        <button class="primary" onclick="confirmQuit()">Yes, Quit</button>
      </div>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="screen-result" class="card hidden">
    <div class="result-icon" id="resultIcon"></div>
    <div class="result-title" id="resultTitle"></div>
    <div class="result-sub" id="resultSub"></div>
    <div class="score-box" id="scoreBox"></div>
    <div style="display:flex; gap:10px; justify-content:center; margin-bottom:6px;">
      <button class="primary" onclick="retakeSame()">🔁 Retake</button>
      <button class="secondary" onclick="goHome()">🏠 Choose Test</button>
    </div>
    <div class="review" id="reviewList"></div>
  </div>
</div>

<script>
// ---------- QUESTION BANKS (California-specific) ----------

// ---------- STATE ----------
let state = { type:null, bank:[], questions:[], current:0, answers:[], selected:null, label:'' };

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function show(id){
  ['screen-type','screen-format','screen-quiz','screen-result'].forEach(s=>{
    document.getElementById(s).classList.toggle('hidden', s!==id);
  });
}

function chooseType(type){
  state.type = type;
  state.bank = type==='car' ? carBank : motoBank;
  document.getElementById('formatBadge').textContent = type==='car' ? '🚗 Car Test' : '🏍️ Motorcycle Test';
  document.getElementById('setPicker').classList.add('hidden');
  show('screen-format');
}

function showSets(){
  const grid = document.getElementById('setGrid');
  grid.innerHTML = '';
  const totalSets = Math.ceil(state.bank.length / 20);
  for(let i=0;i<totalSets;i++){
    const startQ = i*20+1, endQ = Math.min((i+1)*20, state.bank.length);
    const btn = document.createElement('button');
    btn.className = 'set-btn';
    btn.innerHTML = `Set ${i+1}<small>Q${startQ}–${endQ}</small>`;
    btn.onclick = ()=> startSequential(i);
    grid.appendChild(btn);
  }
  document.getElementById('setPicker').classList.remove('hidden');
}

function buildQuestions(rawList){
  return rawList.map(q=>{
    const opts = q.slice(1,5).map((text,i)=>({text, correct:i===q[5]}));
    const shuffled = shuffle(opts);
    return { question:q[0], options:shuffled };
  });
}

function startRandom(){
  const picked = shuffle(state.bank).slice(0,20);
  state.questions = buildQuestions(picked);
  state.label = (state.type==='car' ? '🚗 Car Test' : '🏍️ Motorcycle Test') + ' · 🎲 Random';
  state.lastStart = ()=>startRandom();
  beginQuiz();
}

function startSequential(setIndex){
  const start = setIndex*20;
  const slice = state.bank.slice(start, start+20);
  state.questions = buildQuestions(slice);
  state.label = (state.type==='car' ? '🚗 Car Test' : '🏍️ Motorcycle Test') + ` · 📑 Set ${setIndex+1} (Q${start+1}–${start+slice.length})`;
  state.lastStart = ()=>startSequential(setIndex);
  beginQuiz();
}

function beginQuiz(){
  state.current = 0;
  state.answers = [];
  state.selected = null;
  show('screen-quiz');
  document.getElementById('modeBadge').textContent = state.label;
  renderQuestion();
}

function retakeSame(){ state.lastStart(); }
function goHome(){ show('screen-type'); }

function renderQuestion(){
  const q = state.questions[state.current];
  document.getElementById('qnum').textContent = `Question ${state.current+1} of ${state.questions.length}`;
  document.getElementById('progressBar').style.width = `${(state.current/state.questions.length)*100}%`;
  document.getElementById('qtext').textContent = `❓ ${q.question}`;
  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';
  state.selected = null;
  hideQuitConfirm();
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('nextBtn').textContent = state.current === state.questions.length-1 ? '🏁 Finish' : 'Next ➡️';

  q.options.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt.text;
    btn.onclick = ()=> selectOption(idx);
    optionsDiv.appendChild(btn);
  });
}

function selectOption(idx){
  if(state.selected !== null) return;
  state.selected = idx;
  const q = state.questions[state.current];
  const buttons = document.querySelectorAll('#options .option');
  buttons.forEach((btn,i)=>{
    if(q.options[i].correct){ btn.classList.add('correct'); }
    if(i===idx && !q.options[i].correct){ btn.classList.add('incorrect'); }
    if(i===idx){ btn.classList.add('selected'); }
  });
  state.answers.push({
    question: q.question,
    chosen: q.options[idx].text,
    correctText: q.options.find(o=>o.correct).text,
    isCorrect: q.options[idx].correct
  });
  document.getElementById('nextBtn').disabled = false;
}

function nextQuestion(){
  if(state.current < state.questions.length-1){
    state.current++;
    renderQuestion();
  } else {
    finishTest();
  }
}

function showQuitConfirm(){
  document.getElementById('nav-normal').classList.add('hidden');
  document.getElementById('nav-confirm').classList.remove('hidden');
}
function hideQuitConfirm(){
  document.getElementById('nav-confirm').classList.add('hidden');
  document.getElementById('nav-normal').classList.remove('hidden');
}
function confirmQuit(){ show('screen-format'); }

function finishTest(){
  const total = state.questions.length;
  const correct = state.answers.filter(a=>a.isCorrect).length;
  const pct = Math.round((correct/total)*100);
  const passed = pct >= 80;

  document.getElementById('progressBar').style.width = '100%';
  show('screen-result');
  document.getElementById('resultIcon').textContent = passed ? '🎉' : '😬';
  document.getElementById('resultTitle').innerHTML = passed
    ? '<span class="pass">PASSED!</span>'
    : '<span class="fail">NOT YET , KEEP STUDYING</span>';
  document.getElementById('resultSub').textContent = passed
    ? `Nice work! You're driving toward that ${state.type==='car'?'🚗 license':'🏍️ endorsement'}.`
    : `You need 80% to pass. Review the missed questions below and try again. 💪`;
  document.getElementById('scoreBox').innerHTML = `<span class="${passed?'pass':'fail'}">${correct}/${total} (${pct}%)</span>`;

  const reviewDiv = document.getElementById('reviewList');
  reviewDiv.innerHTML = '<div style="font-weight:700; margin-bottom:6px;">📋 Review</div>';
  state.answers.forEach((a,i)=>{
    const item = document.createElement('div');
    item.className = 'review-item';
    item.innerHTML = `
      <div class="qtext">${i+1}. ${a.question}</div>
      <div class="${a.isCorrect?'tag-correct':'tag-wrong'}">${a.isCorrect?'✅ Correct':'❌ Your answer: '+a.chosen}</div>
      ${a.isCorrect?'':'<div style="color:var(--good)">✔️ Correct answer: '+a.correctText+'</div>'}
    `;
    reviewDiv.appendChild(item);
  });
}
</script>
